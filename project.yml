# XcodeGen manifest for the macOS ownCloud File Provider project (progress.md
# Task 1.1). SPM cannot emit an `.appex`, so the two extensions are Xcode-project
# targets here; all three targets consume the local SPM package `OwnCloudCore`.
#
# The committed Info.plists and .entitlements are used verbatim (via
# INFOPLIST_FILE / CODE_SIGN_ENTITLEMENTS) rather than regenerated, so the
# reviewed Phase 1 artifacts remain the source of truth. Regenerate the project
# with `xcodegen generate`; the `.xcodeproj` itself is not committed.
name: OwnCloudFileProvider
options:
  bundleIdPrefix: com.owncloud.macos.fileprovider
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Development defaults. A tagged release overrides both on the xcodebuild
    # command line (scripts/make-dmg.sh), which outranks these — that is how the
    # tag reaches all three bundles, since every Info.plist here references
    # $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION) rather than a literal.
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "4AP2STM4H5"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    # Required for notarization: the notary service rejects a submission whose
    # executables are not built against the hardened runtime. Applied to every
    # configuration so a Debug build cannot behave differently from what ships.
    ENABLE_HARDENED_RUNTIME: YES

packages:
  OwnCloudCore:
    path: Core

targets:
  App:
    type: application
    platform: macOS
    sources:
      - App/Sources
      # The shared app icon (issue #18). All three bundles reference the same
      # catalog; the app target picks up ASSETCATALOG_COMPILER_APPICON_NAME
      # automatically, the two extensions below must set it explicitly.
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owncloud.macos.fileprovider
        PRODUCT_NAME: "ownCloud File Provider"
        INFOPLIST_FILE: App/SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SupportingFiles/App.entitlements
    dependencies:
      - package: OwnCloudCore
      # The Mac-only adapter layer (NSFileProviderDomain(account:), removal-mode
      # mapping) the app uses to add/remove the domain via NSFileProviderManager.
      - package: OwnCloudCore
        product: FileProviderSupport
      - target: FileProviderExtension
      - target: FileProviderUIExtension

  FileProviderExtension:
    type: app-extension
    platform: macOS
    sources:
      - FileProviderExtension/Sources
      - Resources/Assets.xcassets
    settings:
      base:
        # REQUIRED on an app-extension target: unlike the app target, an .appex
        # does not get this for free, and without it actool produces nothing —
        # the .appex ships with an empty Contents/Resources and no icon at all.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.owncloud.macos.fileprovider.FileProvider
        PRODUCT_NAME: FileProviderExtension
        INFOPLIST_FILE: FileProviderExtension/SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: FileProviderExtension/SupportingFiles/FileProviderExtension.entitlements
      configs:
        # A shipped build must NOT carry com.apple.developer.fileprovider.testing-mode:
        # it is a restricted entitlement granted only through a development
        # provisioning profile, so a Developer ID profile does not include it and
        # signing fails outright. It exists for the AC-3 deterministic test harness,
        # which is a developer concern — hence the Release-only entitlements file.
        Release:
          CODE_SIGN_ENTITLEMENTS: FileProviderExtension/SupportingFiles/FileProviderExtension-Release.entitlements
    dependencies:
      - package: OwnCloudCore
      # The FileProviderItem / ItemEnumerator / RemoteError adapters the
      # replicated extension vends and returns (Phases 3–4).
      - package: OwnCloudCore
        product: FileProviderSupport

  FileProviderUIExtension:
    type: app-extension
    platform: macOS
    sources:
      - FileProviderUIExtension/Sources
      - Resources/Assets.xcassets
    settings:
      base:
        # See the FileProviderExtension target above — an .appex needs this set.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.owncloud.macos.fileprovider.FileProviderUI
        PRODUCT_NAME: FileProviderUIExtension
        INFOPLIST_FILE: FileProviderUIExtension/SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: FileProviderUIExtension/SupportingFiles/FileProviderUIExtension.entitlements
    dependencies:
      - package: OwnCloudCore

schemes:
  App:
    build:
      targets:
        App: all
    run:
      config: Debug
    # `xcodebuild test -scheme App` runs the OwnCloudCore package suite through
    # the project (progress.md Task 1.4, the xcodebuild-test half). Extension
    # XCTest targets are added here as they gain testable logic.
    test:
      targets:
        - package: OwnCloudCore/OwnCloudCoreTests
        - package: OwnCloudCore/FileProviderSupportTests
