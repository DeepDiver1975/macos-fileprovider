# AC-2 CI: four tiers (progress.md Task 6.5, Task 9.7).
#   1. Unit          — swift test (+ xcodebuild test on the Mac); every PR.
#   2. Backend contract — core WebDAV/Graph clients vs. both backends in Docker
#                      on ubuntu-latest; every PR.
#   3. File Provider end-to-end — full domain/Finder behaviour on a macOS runner
#                      with oCIS from its darwin-arm64 binary; nightly + label.
#   4. Installer     — the release pipeline's build half, unsigned; every PR.
#                      Exists so the release path is exercised continuously rather
#                      than first running on a tag (Task 9.7).
#
# Third-party actions are pinned to full commit SHAs (AC-2). actions/checkout
# v4.2.2 == 11bd719. Failing jobs upload diagnostics (AC-6).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # nightly end-to-end (off the :00 mark)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: swift test (core package)
        working-directory: Core
        run: swift test --enable-code-coverage
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: xcodebuild test (app scheme runs the OwnCloudCore suite)
        run: |
          xcodebuild test \
            -project OwnCloudFileProvider.xcodeproj \
            -scheme App \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  backend-contract:
    name: Backend contract (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [classic, ocis]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Load pinned versions
        # Only KEY=value lines go into $GITHUB_ENV; the file's leading comments
        # would otherwise be rejected as "Invalid format".
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' test/fixtures/versions.env >> "$GITHUB_ENV"
      - name: Start ${{ matrix.backend }}
        run: docker compose -f test/fixtures/${{ matrix.backend }}/docker-compose.yml up -d --wait
      - name: Trust the oCIS fixture certificate
        # oCIS insists on https even for the fixture (its IDP refuses a non-https
        # issuer), and swift-corelibs-foundation on Linux has no serverTrust API to
        # accept a self-signed cert at runtime — so trust it at the OS level. The
        # cert's SAN already covers localhost/127.0.0.1. Classic serves plain http
        # and skips this.
        if: matrix.backend == 'ocis'
        run: |
          openssl s_client -connect localhost:9200 -servername localhost </dev/null 2>/dev/null \
            | openssl x509 | sudo tee /usr/local/share/ca-certificates/ocis-fixture.crt >/dev/null
          sudo update-ca-certificates
      - name: Run backend-contract tests
        env:
          OWNCLOUD_TEST_BACKEND: ${{ matrix.backend }}
        run: |
          # The contract suites live in the core package and are gated on the
          # OWNCLOUD_TEST_BACKEND env var so they are skipped in the pure-unit run.
          # BackendContract covers the WebDAV/Graph request+parse layer for both
          # backends; ServerProbeContract exercises the Classic sign-in probe
          # (Task 7.11) end to end; OIDCDiscoveryContract exercises the oCIS sign-in
          # discovery fetch (Task 7.8); OCISSignInContract drives the whole oCIS OIDC
          # sign-in chain — discovery → authorize → PKCE code exchange → bearer
          # credential → me/drives → OCISSignInResolver → refresh grant — against the
          # live Konnect IDP, with the browser step scripted via Konnect's logon API
          # (Tasks 7.8/7.12/2.5); ClassicBackendAdminContract exercises the acceptance
          # harness's Classic fixture-provisioning action bodies (Task 6.3) against the
          # live server. Each self-skips on the backend leg it does not apply to.
          cd Core && swift test --filter 'BackendContract|ServerProbeContract|OIDCDiscoveryContract|OCISSignInContract|ClassicBackendAdminContract'
      - name: Collect server logs on failure (AC-6)
        if: failure()
        run: docker compose -f test/fixtures/${{ matrix.backend }}/docker-compose.yml logs > backend-logs.txt
      - name: Upload diagnostics (AC-6)
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: backend-${{ matrix.backend }}-logs
          path: backend-logs.txt

  end-to-end:
    name: File Provider end-to-end (oCIS)
    # Nightly, or on PRs carrying the full-ci label.
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Load pinned versions
        # Only KEY=value lines go into $GITHUB_ENV; the file's leading comments
        # would otherwise be rejected as "Invalid format".
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' test/fixtures/versions.env >> "$GITHUB_ENV"
      - name: Start oCIS from darwin-arm64 binary
        run: ./test/fixtures/ocis/start-ocis-macos.sh &
      # The macOS end-to-end tier (domain add + Finder behaviour) requires a
      # signing identity the runner accepts and the app in /Applications
      # (progress.md Task 6.0). Wired once that spike passes; Classic v11 has no
      # end-to-end tier here (AC-2 known gap).
      - name: Placeholder — end-to-end harness pending Task 6.0
        run: echo "End-to-end tier pending the Task 6.0 spike on a real macOS runner."

  installer:
    name: Installer (unsigned smoke build)
    # Tier 4. Runs the release pipeline's build half — Release-configuration archive,
    # version stamping, .dmg packaging — on every PR, so a defect in it surfaces here
    # rather than the first time a tag depends on it (Task 9.7).
    #
    # No secrets, deliberately: SIGNING=none needs no certificate, no provisioning
    # profile and no App Store Connect key, so this job also runs on fork PRs, where
    # secrets are unavailable no matter what is configured. What it therefore cannot
    # prove is everything behind a Developer ID signature — export, notarization,
    # stapling. That half runs from release.yml (Task 9.8).
    #
    # The shipped entitlements are not checked here either: make-dmg.sh reads them from
    # the code signature, and an unsigned .appex has none. ReleaseEntitlementsTests in
    # the unit tier pins the declarations instead.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Self-test the tag -> version parser
        # Seconds, and it is the one release step that needs no build at all — so a
        # broken parser fails before twenty minutes of archiving.
        run: make release-version-test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the unsigned installer
        # VERSION=0.0.0 deliberately: a smoke build is not a release, and an About
        # window reading `0.0.0 (1234)` says so unambiguously while still naming the
        # run that produced it. BUILD is the run number, so CFBundleVersion increases.
        run: make dmg SIGNING=none VERSION=0.0.0 BUILD=${{ github.run_number }}
      - name: Upload the unsigned .dmg
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: installer-unsigned
          path: dist/*.dmg
          # An image per PR run adds up, and its value is in being downloadable while
          # the PR is open, not months later.
          retention-days: 14
      - name: Collect build diagnostics on failure (AC-6)
        if: failure()
        run: |
          {
            echo "--- dist/ ---"
            ls -lR dist || echo "no dist/ directory"
            echo "--- signing-mode.txt ---"
            cat dist/signing-mode.txt 2>/dev/null || echo "absent (failed before packaging)"
            echo "--- artifact-path.txt ---"
            cat dist/artifact-path.txt 2>/dev/null || echo "absent (failed before packaging)"
          } > installer-diagnostics.txt
      - name: Upload diagnostics (AC-6)
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: installer-diagnostics
          path: installer-diagnostics.txt
